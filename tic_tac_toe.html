<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --accent: #38bdf8;
    --accent2: #f472b6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --win: #4ade80;
    --x-color: #38bdf8;
    --o-color: #f472b6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg1));
    color: var(--text);
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }
  h1 {
    text-align: center;
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  h1 .x { color: var(--x-color); }
  h1 .o { color: var(--o-color); }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 22px; font-size: 14px; }
  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 18px;
    margin: 10px 0;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #0284c7);
    color: #fff;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35); }
  .btn.secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.15); }
  .btn.secondary:hover { box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1); }
  .btn.easy { background: linear-gradient(135deg, #4ade80, #16a34a); }
  .btn.medium { background: linear-gradient(135deg, #facc15, #ca8a04); color: #1e293b; }
  .btn.hard { background: linear-gradient(135deg, #f87171, #dc2626); }
  .scoreboard {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }
  .score {
    flex: 1;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 8px 4px;
  }
  .score .label { font-size: 12px; color: var(--muted); }
  .score .value { font-size: 22px; font-weight: 700; }
  .score .value.xv { color: var(--x-color); }
  .score .value.ov { color: var(--o-color); }
  .score .value.dv { color: var(--muted); }
  .status {
    text-align: center;
    font-size: 16px;
    margin-bottom: 14px;
    min-height: 24px;
    font-weight: 600;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    font-size: 52px;
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    user-select: none;
  }
  .cell:hover:not(.taken) { background: rgba(255, 255, 255, 0.12); transform: scale(1.03); }
  .cell.x { color: var(--x-color); }
  .cell.o { color: var(--o-color); }
  .cell.win-cell { background: rgba(74, 222, 128, 0.25); border-color: var(--win); animation: pulse 0.6s ease infinite alternate; }
  .cell:disabled { cursor: default; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 23, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    animation: fadeIn 0.25s ease;
  }
  .overlay.active { display: flex; }
  .overlay-card {
    background: var(--bg2);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 32px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  .overlay-card h2 { font-size: 28px; margin-bottom: 8px; }
  .overlay-card p { color: var(--muted); margin-bottom: 20px; font-size: 15px; }
  .result-text.win { color: var(--win); }
  .result-text.lose { color: #f87171; }
  .result-text.draw { color: #facc15; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { from { box-shadow: 0 0 0 rgba(74, 222, 128, 0); } to { box-shadow: 0 0 18px rgba(74, 222, 128, 0.5); } }
</style>
</head>
<body>
<div class="app">
  <h1><span class="x">Tic</span> <span class="o">Tac</span> <span class="x">Toe</span></h1>
  <div class="subtitle">Classic fun, reimagined</div>
  <!-- Main menu -->
  <div id="menuScreen" class="screen active">
    <button class="btn" onclick="showScreen('modeScreen')">▶ Play</button>
  </div>
  <!-- Mode select -->
  <div id="modeScreen" class="screen">
    <button class="btn" onclick="selectMode('single')">🤖 Single Player</button>
    <button class="btn" onclick="selectMode('two')">👥 Two Players</button>
    <button class="btn secondary" onclick="showScreen('menuScreen')">← Back to Menu</button>
  </div>
  <!-- Difficulty select -->
  <div id="difficultyScreen" class="screen">
    <div class="subtitle" style="margin-bottom:12px;">Choose difficulty</div>
    <button class="btn easy" onclick="selectDifficulty('easy')">😊 Easy</button>
    <button class="btn medium" onclick="selectDifficulty('medium')">😐 Medium</button>
    <button class="btn hard" onclick="selectDifficulty('hard')">😈 Hard</button>
    <button class="btn secondary" onclick="showScreen('modeScreen')">← Back</button>
  </div>
  <!-- Game -->
  <div id="gameScreen" class="screen">
    <div class="scoreboard">
      <div class="score">
        <div class="label" id="scoreXLabel">Player 1 (X)</div>
        <div class="value xv" id="scoreX">0</div>
      </div>
      <div class="score">
        <div class="label">Draws</div>
        <div class="value dv" id="scoreD">0</div>
      </div>
      <div class="score">
        <div class="label" id="scoreOLabel">Player 2 (O)</div>
        <div class="value ov" id="scoreO">0</div>
      </div>
    </div>
    <div class="status" id="statusText"></div>
    <div class="board" id="board"></div>
    <button class="btn secondary" onclick="backToMenu()">← Back to Menu</button>
  </div>
</div>
<!-- Result overlay -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-card">
    <h2 id="resultTitle" class="result-text"></h2>
    <p id="resultDetail"></p>
    <button class="btn" id="primaryActionBtn" onclick="primaryAction()">Rematch</button>
    <button class="btn secondary" onclick="backToMenu()">Back to Menu</button>
  </div>
</div>
<script>
  const HUMAN = "X";
  const COMPUTER = "O";
  const state = {
    board: Array(9).fill(null),
    currentPlayer: HUMAN, // X always goes first
    mode: null,           // 'single' | 'two'
    difficulty: null,   // 'easy' | 'medium' | 'hard'
    round: 1,
    scores: { X: 0, O: 0, D: 0 },
    gameOver: false,
    computerThinking: false,
    lastResult: null,     // 'win' | 'draw'  (who won handled via board)
    winnerMark: null,
  };
  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];
  /* ---------- Screen navigation ---------- */
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.getElementById("resultOverlay").classList.remove("active");
  }
  function selectMode(mode) {
    state.mode = mode;
    if (mode === "single") {
      showScreen("difficultyScreen");
    } else {
      startGame();
    }
  }
  function selectDifficulty(diff) {
    state.difficulty = diff;
    startGame();
  }
  function backToMenu() {
    state.mode = null;
    state.difficulty = null;
    state.round = 1;
    state.scores = { X: 0, O: 0, D: 0 };
    showScreen("menuScreen");
  }
  /* ---------- Game setup ---------- */
  function startGame() {
    state.round = 1;
    state.scores = { X: 0, O: 0, D: 0 };
    if (state.mode === "single") {
      document.getElementById("scoreXLabel").textContent = "You (X)";
      document.getElementById("scoreOLabel").textContent = "Computer (O)";
    } else {
      document.getElementById("scoreXLabel").textContent = "Player 1 (X)";
      document.getElementById("scoreOLabel").textContent = "Player 2 (O)";
    }
    showScreen("gameScreen");
    updateScores();
    newRound();
  }
  function newRound() {
    state.board = Array(9).fill(null);
    state.currentPlayer = HUMAN; // Player 1 / human always first
    state.gameOver = false;
    state.computerThinking = false;
    state.lastResult = null;
    state.winnerMark = null;
    renderBoard();
    updateStatus();
  }
  /* ---------- Rendering ---------- */
  function renderBoard() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    state.board.forEach((mark, i) => {
      const cell = document.createElement("button");
      cell.className = "cell" + (mark ? " taken " + mark.toLowerCase() : "");
      cell.textContent = mark || "";
      cell.addEventListener("click", () => onCellClick(i));
      boardEl.appendChild(cell);
    });
  }
  function highlightWin(line) {
    const cells = document.querySelectorAll(".cell");
    line.forEach(i => cells[i].classList.add("win-cell"));
  }
  function updateStatus() {
    const el = document.getElementById("statusText");
    if (state.mode === "two") {
      el.textContent = state.currentPlayer === "X"
        ? "Player 1's turn (X)"
        : "Player 2's turn (O)";
    } else {
      if (state.computerThinking) {
        el.textContent = "Computer is thinking...";
      } else {
        el.textContent = "Your turn (X)";
      }
    }
    el.style.color = state.currentPlayer === "X" ? "var(--x-color)" : "var(--o-color)";
  }
  function updateScores() {
    document.getElementById("scoreX").textContent = state.scores.X;
    document.getElementById("scoreO").textContent = state.scores.O;
    document.getElementById("scoreD").textContent = state.scores.D;
  }
  /* ---------- Gameplay ---------- */
  function onCellClick(i) {
    if (state.gameOver || state.board[i] || state.computerThinking) return;
    if (state.mode === "single" && state.currentPlayer === COMPUTER) return;
    makeMove(i, state.currentPlayer);
    if (state.gameOver) return;
    if (state.mode === "single") {
      state.computerThinking = true;
      updateStatus();
      setTimeout(() => {
        const move = getComputerMove();
        if (move !== null && move !== undefined) makeMove(move, COMPUTER);
        state.computerThinking = false;
        if (!state.gameOver) updateStatus();
      }, 450);
    } else {
      updateStatus();
    }
  }
  function makeMove(i, mark) {
    state.board[i] = mark;
    renderBoard();
    const winLine = getWinLine(state.board, mark);
    if (winLine) {
      state.gameOver = true;
      state.lastResult = "win";
      state.winnerMark = mark;
      state.scores[mark]++;
      updateScores();
      highlightWin(winLine);
      setTimeout(showResult, 600);
      return;
    }
    if (state.board.every(c => c !== null)) {
      state.gameOver = true;
      state.lastResult = "draw";
      state.scores.D++;
      updateScores();
      setTimeout(showResult, 600);
      return;
    }
    state.currentPlayer = mark === "X" ? "O" : "X";
    updateStatus();
  }
  /* ---------- Result overlay ---------- */
  function showResult() {
    const title = document.getElementById("resultTitle");
    const detail = document.getElementById("resultDetail");
    const primaryBtn = document.getElementById("primaryActionBtn");
    title.className = "result-text";
    if (state.lastResult === "draw") {
      if (state.mode === "single") {
        title.textContent = "It's a Draw!";
        title.classList.add("draw");
        detail.textContent = `Round ${state.round} ended in a draw. Ready for Round ${state.round + 1}?`;
        primaryBtn.textContent = `▶ Next Round (Round ${state.round + 1})`;
      } else {
        title.textContent = "It's a Draw!";
        title.classList.add("draw");
        detail.textContent = `Round ${state.round} ended in a draw. Ready for Round ${state.round + 1}?`;
        primaryBtn.textContent = `▶ Next Round (Round ${state.round + 1})`;
      }
    } else {
      // Someone won
      if (state.mode === "two") {
        const winnerNum = state.winnerMark === "X" ? 1 : 2;
        title.textContent = `Player ${winnerNum} Wins!`;
        title.classList.add("win");
        detail.textContent = `Player ${winnerNum} (${state.winnerMark}) takes Round ${state.round}!`;
        primaryBtn.textContent = "🔁 Rematch";
      } else {
        if (state.winnerMark === HUMAN) {
          title.textContent = "You Win! 🎉";
          title.classList.add("win");
          detail.textContent = `You beat the computer on ${capitalize(state.difficulty)} mode in Round ${state.round}!`;
        } else {
          title.textContent = "You Lose!";
          title.classList.add("lose");
          detail.textContent = `The computer (${state.difficulty} mode) takes Round ${state.round}. Try again?`;
        }
        primaryBtn.textContent = "🔁 Rematch";
      }
    }
    document.getElementById("resultOverlay").classList.add("active");
  }
  function primaryAction() {
    document.getElementById("resultOverlay").classList.remove("active");
    if (state.lastResult === "draw") {
      state.round++;
    }
    newRound();
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  /* ---------- Win / draw helpers ---------- */
  function getWinLine(board, mark) {
    for (const line of WIN_LINES) {
      if (line.every(i => board[i] === mark)) return line;
    }
    return null;
  }
  /* ---------- AI ---------- */
  function getComputerMove() {
    const empty = state.board.map((v, i) => v ? null : i).filter(v => v !== null);
    if (empty.length === 0) return null;
    if (state.difficulty === "easy") {
      return randomMove(empty);
    }
    if (state.difficulty === "medium") {
      // 1. Win if possible
      let move = findFinishingMove(COMPUTER);
      if (move !== null) return move;
      // 2. Block opponent win
      move = findFinishingMove(HUMAN);
      if (move !== null) return move;
      // 3. Take center
      if (state.board[4] === null) return 4;
      // 4. Random
      return randomMove(empty);
    }
    // Hard: minimax
    return bestMoveMinimax();
  }
  function randomMove(empty) {
    return empty[Math.floor(Math.random() * empty.length)];
  }
  function findFinishingMove(mark) {
    for (let i = 0; i < 9; i++) {
      if (state.board[i] !== null) continue;
      state.board[i] = mark;
      const wins = getWinLine(state.board, mark) !== null;
      state.board[i] = null;
      if (wins) return i;
    }
    return null;
  }
  function bestMoveMinimax() {
    let bestScore = -Infinity;
    let move = null;
    for (let i = 0; i < 9; i++) {
      if (state.board[i] !== null) continue;
      state.board[i] = COMPUTER;
      const score = minimax(state.board, 0, false, -Infinity, Infinity);
      state.board[i] = null;
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
    return move;
  }
  function minimax(board, depth, isMaximizing, alpha, beta) {
    if (getWinLine(board, COMPUTER)) return 10 - depth;
    if (getWinLine(board, HUMAN)) return depth - 10;
    if (board.every(c => c !== null)) return 0;
    if (isMaximizing) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (board[i] !== null) continue;
        board[i] = COMPUTER;
        best = Math.max(best, minimax(board, depth + 1, false, alpha, beta));
        board[i] = null;
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (board[i] !== null) continue;
        board[i] = HUMAN;
        best = Math.min(best, minimax(board, depth + 1, true, alpha, beta));
        board[i] = null;
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }
</script>
</body>
</html>
